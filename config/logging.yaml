version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "[%(asctime)s] [%(levelname)-8s] [%(name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  audit:
    format: "[%(asctime)s] [AUDIT] [%(name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: "zyron.log"
    encoding: "utf-8"

loggers:
  zyron:
    level: DEBUG
    handlers: [file]
    propagate: false

  zyron.audit:
    level: INFO
    handlers: [file]
    propagate: false

root:
  level: INFO
  handlers: [file]
