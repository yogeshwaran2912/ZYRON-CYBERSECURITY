[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zyron-cybersecurity"
version = "0.1.0"
description = "ZYRON - Modular Cybersecurity Research & Automation Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Authorized Educational Research"}
authors = [
    {name = "ZYRON Security Team"}
]
keywords = [
    "cybersecurity",
    "bug-bounty",
    "red-team",
    "penetration-testing",
    "automation",
    "scope-enforcement"
]
dependencies = [
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
